// Honyomi 插件仓库索引 schema（publish 输出 index.bin，宿主侧手写 wire 解码器解码）。
// 字段布局对齐 mihon NetworkExtensionStore（kotlinx @ProtoNumber）：1-8 完全一致，
// 9-11 为 Honyomi 扩展字段（mihon schema 之外，protobuf 前向兼容）。
// 客户端按首字节嗅探格式：'{' / '[' → 旧 JSON 索引，其余 → 本 protobuf 索引（同 mihon ExtensionStoreService）。
//
// 注意：宿主解码器为 entry/src/main/ets/data/RepoProto.ets 的手写 proto3 wire 解析
// （@ohos/protobufjs HAR dist 缺失 codegen，不可用），新增/修改字段时必须同步更新该解码器。
syntax = "proto3";

package honyomi.repo;

// 仓库索引顶层（对齐 mihon NetworkExtensionStore）
message RepoIndex {
  string name = 1;                        // 仓库展示名（缺省时客户端回退主机名）
  string badgeLabel = 2;
  string signingKey = 3;
  RepoContact contact = 4;
  RepoExtensionList extensionList = 101;
  string extensionListUrl = 102;
}

message RepoContact {
  string website = 1;                     // 仓库官网（manifest 之外的仓库级声明）
  string discord = 2;
}

message RepoExtensionList {
  repeated RepoExtension extensions = 1;
}

// 单个插件条目（对齐 mihon NetworkExtensionStore.Extension）
message RepoExtension {
  string name = 1;                        // 插件名（manifest.name）
  string packageName = 2;                 // 插件 key（小写 UUID v4）
  RepoResources resources = 3;
  string extensionLib = 4;                // DSL 版本（manifest.dslVersion 的数字字符串）
  int64 versionCode = 5;                  // manifest.versionCode
  string versionName = 6;                 // manifest.version
  ContentWarning contentWarning = 7;      // nsfw → CONTENT_WARNING_NSFW
  repeated RepoSource sources = 8;        // 单源：承载语言与站点首页
  // ---- Honyomi 扩展字段（mihon schema 之外） ----
  bool bt = 9;                            // BT 源标记（内容为种子/magnet 下载）
  repeated ContentType contentTypes = 10; // 内容类型（可多选；[0] 为主类型）
  string checksum = 11;                   // .honyomiplug sha256（hex）：release 安装强制校验
  bool acgn = 12;                         // ACGN 内容源标记（宿主据此启用 Bangumi 相关系列匹配）
}

message RepoResources {
  string apkUrl = 1;                      // packs/<key>.honyomiplug（相对 index.bin），或 GitHub Release 绝对 https
  string iconUrl = 2;                     // icons/<key>-<hash>.png（相对 index.bin），或 GitHub Release 绝对 https
}

message RepoSource {
  int64 id = 1;                           // 恒 0（宿主源 id 为 UUID，不走数值 id）
  string name = 2;
  string language = 3;                    // manifest.lang（缺省 multi）
  string homeUrl = 4;                     // 站点首页（manifest.baseUrl）
  repeated string mirrorUrls = 5;
  string message = 7;
}

// 对齐 mihon ContentWarning 枚举（kotlinx @ProtoNumber）
enum ContentWarning {
  CONTENT_WARNING_UNSPECIFIED = 0;
  CONTENT_WARNING_SAFE = 1;
  CONTENT_WARNING_MIXED = 2;
  CONTENT_WARNING_NSFW = 3;
}

// 内容类型（Honyomi 扩展枚举）：插件可同时承载多种内容类型，
// 宿主按 [0] 主类型路由，作品可声明自身类型覆盖（未声明回退插件主类型）
enum ContentType {
  CONTENT_TYPE_UNSPECIFIED = 0;
  CONTENT_TYPE_MANGA = 1;
  CONTENT_TYPE_NOVEL = 2;
  CONTENT_TYPE_VIDEO = 3;
}
